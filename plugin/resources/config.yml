# MTC Server Control - connects this Minecraft server to the MTC website.
# The website decides when the server is open (each event's daily server hours, or the
# OPEN NOW / CLOSE NOW buttons in Admin > Events > Server control).

# The MTC website
site: "https://mtc.kovaihost.cloud"

# The plugin key from the website: Admin > Events > Server control. Keep it secret.
key: ""

# The event this server is for, as its slug (the part after ?slug= in the event link), e.g. hide-and-seek.
# Leave empty to follow whichever event is live on the website.
event: ""

# How often to ask the website, in seconds
poll-seconds: 15

# Who can always join and stay, even while the server is closed.
# LuckPerms gives every member of a group the permission group.<name>, so these cover the staff groups.
bypass-permissions:
  - mtc.bypass
  - group.admin
  - group.dev
  - group.founder
  - group.owner
# Server operators (/op) can always join too
ops-bypass: true

# Show the open / closed message in the server list (MOTD)
change-motd: true

# Warn players this many minutes before the server closes (chat + sound; a big title in the last 5 minutes)
warn-minutes: [30, 15, 10, 5, 2, 1]
# A countdown bar at the top of the screen for the last N minutes (0 = off)
bossbar-minutes: 10
# Play a "ding" with each warning
warn-sound: true

# World backups to Google Drive (see the README for the 5-minute setup)
backup:
  enabled: false
  # How often (hours). 0 = only after closing / by hand
  every-hours: 6
  # Also back up 1 minute after the server closes for the day
  after-close: true
  # How many backups to keep in Drive (older ones are deleted)
  keep: 10
  # Only these worlds (empty = all worlds)
  worlds: []
  # Tell players in chat when a backup starts and ends
  announce: true
  name-prefix: mtc-backup
  google:
    # From Google Cloud: an OAuth client of type "TVs and Limited Input devices"
    client-id: ""
    client-secret: ""
    # The Drive folder the plugin makes for its backups
    folder: "MTC Backups"
