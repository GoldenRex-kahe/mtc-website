<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator | MTC</title>
<meta name="description" content="A member of MC Thamizh Creators: their skin, latest videos and MTC events.">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
main{max-width:1180px}
.c-banner{position:relative;aspect-ratio:1280/212;background:#1c130b center/cover no-repeat;border:4px solid #000;border-bottom:0}
.c-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#1c130b99 75%,#1c130b),linear-gradient(90deg,#1c130b66,#0000 18%,#0000 82%,#1c130b66)}
.c-hero.has-ban{border-top-width:0;margin-top:-1px}
.c-hero{display:grid;grid-template-columns:minmax(260px,380px) 1fr;border:4px solid #000;background:#1c130b;margin-bottom:22px;position:relative;overflow:hidden}
/* ---- MTC disco lobby: the club is drawn in 3D in the canvas; the CSS only paints the dark room behind it ---- */
.c-skin{position:relative;min-height:500px;border-right:4px solid #000;overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse 70% 45% at 50% 30%,#3b1a5c 0%,#1a0d2b 55%,#07040c 100%)}
.c-skin canvas{position:absolute;inset:0;z-index:2;cursor:grab;touch-action:pan-y}
.c-skin canvas:active{cursor:grabbing}
.c-skin .none{position:relative;z-index:5;color:#fff;text-align:center;padding:30px;text-shadow:1px 1px #000}
.lb-emote{position:absolute;z-index:6;bottom:34px;left:50%;translate:-50% 0;font:9px var(--display);color:#fff;background:#000000b0;border:2px solid #000;outline:2px solid #ffffff30;padding:7px 10px;white-space:nowrap;
  opacity:0;transform:translateY(6px) scale(.9);transition:opacity .25s,transform .25s}
.lb-emote.on{opacity:1;transform:none}
.lb-emote small{font:8px var(--display);color:#ffd9a0;opacity:.8}
.lb-tag{position:absolute;z-index:6;bottom:10px;left:50%;translate:-50% 0;font:8px var(--display);color:#ffffffb0;letter-spacing:.2em;white-space:nowrap;text-shadow:1px 1px #000}
.c-info{padding:28px 30px;display:flex;flex-direction:column;gap:14px;min-width:0}
.c-top{display:flex;gap:18px;align-items:center}
.c-logo{width:96px;height:96px;border:4px solid #000;object-fit:cover;flex:none;background:#2a1d12}
.c-top h1{margin:0;font-size:clamp(22px,3.6vw,38px);word-break:break-word}
.c-sub{color:var(--soft);font-size:15px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.c-sub img{width:22px;height:22px;border-radius:50%}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.lvbadge{display:inline-flex;align-items:center;gap:7px;font:8px 'Press Start 2P',monospace;letter-spacing:.06em;color:#fff;background:#c4302b;padding:7px 10px;border:3px solid #000;box-shadow:0 0 14px #c4302b88;text-decoration:none}
.lvbadge i{width:8px;height:8px;border-radius:50%;background:#fff;animation:lvp 1.2s ease-in-out infinite}@keyframes lvp{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.lvbadge i{animation:none}}
.stchips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.stchip{display:inline-flex;align-items:center;gap:9px;padding:7px 12px 7px 9px;background:linear-gradient(180deg,#24180e,#120b06);border:3px solid #000;box-shadow:inset 0 -3px 0 var(--sc),inset 0 1px 0 #ffffff14}
.stchip>svg{width:26px;height:26px;flex:none;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--sc) 55%,transparent))}
.stchip>span{display:grid;line-height:1.25;font:9px var(--display);color:var(--ink);letter-spacing:.03em}
.stchip small{font:600 10px Archivo,sans-serif;letter-spacing:.08em;color:var(--soft)}
.stchip.sc-ver{--sc:#4c9a2a}.stchip.sc-ev{--sc:#3a78b8}.stchip.sc-win{--sc:#d4af37}.stchip.sc-pod{--sc:#c07a3d}
.stchip{flex:none;width:auto;justify-content:flex-start}.stchip>span{text-align:left}
.mcname{display:inline-flex;gap:8px;align-items:center;font:11px var(--display);padding:9px 12px;border:3px solid #000;background:#0d0804;color:var(--accent);cursor:pointer}
.socs{display:flex;gap:8px;flex-wrap:wrap}
.socs a{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:3px solid #000;background:#2a1d12;color:var(--ink);font-weight:700;text-decoration:none}
.socs a:hover{background:#3a2a1c}.socs img{width:22px;height:22px}
.c-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.c-stats div{border:3px solid #000;background:#1c130b;padding:14px;text-align:center}
.c-stats b{display:block;font:20px var(--display);color:var(--accent)}
.c-stats span{font-size:13px;color:var(--soft)}
.c-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px;align-items:start}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.vid{border:3px solid #000;background:#0d0804;cursor:pointer;text-align:left;padding:0;color:var(--ink);font:inherit}
.vid .th{aspect-ratio:16/9;background:#2a1d12 center/cover;position:relative}
.vid .th i{position:absolute;inset:auto 8px 8px auto;background:#000c;color:#fff;font-size:11px;padding:2px 6px;font-style:normal}
.vid .t{padding:8px 10px 10px;font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .m{padding:0 10px 10px;font-size:12px;color:var(--soft)}
.vid:hover{outline:3px solid var(--accent)}
.evs{display:grid;gap:10px}
.ev{display:grid;grid-template-columns:200px 1fr auto;gap:14px;align-items:center;border:3px solid #000;background:#0d0804;color:var(--ink);text-decoration:none;padding:0 14px 0 0;transition:transform .15s}
/* event banners are 16:7 (1920x840), so the thumbnail uses the same shape and shows the whole image */
.ev .bn{aspect-ratio:16/7;width:100%;align-self:center;background:#0d0804 center/contain no-repeat;border-right:3px solid #000}
.ev .tx{min-width:0;padding:10px 0}
.ev .tx b{display:block;font-size:16px;line-height:1.25}
.ev .meta{display:block;font-size:13px;color:var(--soft);margin:4px 0 8px}
.ev .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ev .role{font-size:12px;font-weight:700;padding:3px 8px;border:2px solid #3a2a1c;color:var(--ink)}
.ev .pl{text-align:center;min-width:56px}
.ev .pl .md{display:block;font-size:30px;line-height:1}
.ev .pl small{display:block;font:8px var(--display);color:var(--accent);margin-top:4px}
.ev:hover{transform:translateY(-2px);outline:3px solid var(--accent)}
.ev.dim .bn{filter:grayscale(.6) brightness(.7)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #2a1d12}
.tl li:last-child{border:0}.tl .ic{font-size:18px}.tl a{color:var(--ink)}.tl small{display:block;color:var(--soft)}
.feat{aspect-ratio:16/9;border:3px solid #000;background:#000 center/cover;position:relative;cursor:pointer;width:100%}
.feat i{position:absolute;inset:0;margin:auto;width:72px;height:50px;background:#f00;border-radius:12px;display:grid;place-items:center}
.feat i::after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.feat iframe{width:100%;height:100%;border:0;display:block}
.navc{display:flex;justify-content:space-between;gap:12px;margin:26px 0 10px;flex-wrap:wrap}
.navc a{display:flex;gap:10px;align-items:center;padding:10px 14px;border:3px solid #000;background:#1c130b;color:var(--ink);text-decoration:none;font-weight:700}
.navc a img{width:36px;height:36px;border:2px solid #000;object-fit:cover}
.navc a:hover{background:#2a1d12}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media(max-width:900px){.c-hero{grid-template-columns:1fr}.c-skin{border-right:0;border-bottom:4px solid #000;min-height:420px}.c-grid{grid-template-columns:1fr}.c-stats{grid-template-columns:repeat(3,1fr)}}
.ev .pl .md.num{font:16px var(--display);color:var(--accent)}
@media(max-width:560px){.c-info{padding:20px 18px}.c-logo{width:72px;height:72px}.c-stats{grid-template-columns:repeat(2,1fr)}.ev{grid-template-columns:120px 1fr auto;gap:10px;padding-right:10px}.ev .tx b{font-size:14px}}
.bdgrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
</style>
<script src="/assets/px.js"></script>
</head>
<body>
<header id="nav"></header>
<main id="main"><p class="soft">Loading creator...</p></main>
<script src="/assets/md.js"></script>
<script src="/assets/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3.0.1/bundles/skinview3d.bundle.js"></script>
<script>
const {$, esc, api, toast, badge, bannerStyle} = MTC;
MTC.nav('creators');
const key = new URLSearchParams(location.search).get('u') || (location.hash.match(/creator=(.+)/) || [])[1] || '';
const ago = iso => { if (!iso) return ''; const s = (Date.now() - new Date(iso)) / 1000, U = [['year', 31536e3], ['month', 2592e3], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]];
  for (const [n, v] of U) if (s >= v) { const k = Math.floor(s / v); return `${k} ${n}${k > 1 ? 's' : ''} ago`; } return 'just now'; };
const views = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M views' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'K views' : n + ' views';
const day = iso => iso ? new Intl.DateTimeFormat('en-IN', {month: 'short', year: 'numeric'}).format(new Date(iso)) : '';
const SOC = {youtube: 'YouTube', instagram: 'Instagram', discord: 'Discord', x: 'X', twitch: 'Twitch', facebook: 'Facebook', website: 'Website'};
const VI={
  seal:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" fill="#22a447" stroke="#0d0804" stroke-width="1.6" stroke-linejoin="round"/><path d="m8.6 12.2 2.4 2.4 4.6-4.8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  youtube:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="5" width="22" height="14" rx="4" fill="#ff0033"/><path d="M10 9v6l5.2-3z" fill="#fff"/></svg>',
  gamepad:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12a5 5 0 0 1 4.9 6l-.8 4a3 3 0 0 1-5.2 1.3L15 16H9l-1.9 2.3A3 3 0 0 1 1.9 17l-.8-4A5 5 0 0 1 6 7z" fill="#4aa3ff"/><path d="M6 10v4M4 12h4" stroke="#0d0804" stroke-width="2"/><circle cx="16" cy="11" r="1.4" fill="#0d0804"/><circle cx="18.6" cy="13.6" r="1.4" fill="#0d0804"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5H3.5a3.5 3.5 0 0 0 4 4.5M17 5h3.5a3.5 3.5 0 0 1-4 4.5" stroke="#ffd23f" stroke-width="2" fill="none"/><path d="M7 2.5h10V8a5 5 0 0 1-10 0z" fill="#ffd23f"/><path d="M10.8 12.5h2.4V16h-2.4z" fill="#e8861a"/><path d="M8.5 16h7v3h-7z" fill="#e8861a"/><path d="M7 19h10v2.5H7z" fill="#8a5a1c"/></svg>',
  medal:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 1.5h4.5l2.2 6.5H8.7zM13 1.5h4.5L15.3 8h-4.5z" fill="#4aa3ff"/><circle cx="12" cy="15" r="7.5" fill="#ffd23f"/><circle cx="12" cy="15" r="4.8" fill="none" stroke="#e8861a" stroke-width="1.6"/></svg>',
};
const medal = p => p === 1 ? '🥇' : p === 2 ? '🥈' : p === 3 ? '🥉' : p ? '#' + p : '';
function play(id, title) { MTC.lightbox({type: 'youtube', url: 'https://www.youtube.com/watch?v=' + id, caption: title}); }

async function load() {
  if (!key) { $('#main').innerHTML = '<h1>CREATOR</h1><p class="soft">No creator picked. <a href="/#creators">See all creators</a></p>'; return; }
  let d; try { d = await api('/api/creators/' + encodeURIComponent(key)); }
  catch (x) { $('#main').innerHTML = `<h1>CREATOR</h1><p class="msg err">${esc(x.message)}</p><p><a class="btn" href="/#creators">SEE ALL CREATORS</a></p>`; return; }
  const c = d.creator, s = d.stats, v = (d.youtube || {}).videos || [];
  setTimeout(() => api('/api/badges/' + c.id).then(b => { const el = document.getElementById('crBadges'); if (el && b.badges.length) el.innerHTML = MTC.badgeIcons(b.badges).replace('class="bdgs"', 'class="bdgs big"'); }).catch(() => {}), 0);
  document.title = c.name + ' | MTC';
  const fv = c.featured && /^[\w-]{11}$/.test(c.featured.id || '') ? c.featured.id : '';
  const socs = Object.entries(c.socials).filter(([, u]) => u);
  $('#main').innerHTML = `
    ${c.banner ? `<div class="c-banner" style="background-image:url('${esc(c.banner)}')" role="img" aria-label="${esc(c.name)} YouTube banner"></div>` : ''}
    <section class="c-hero${c.banner ? ' has-ban' : ''}">
      <div class="c-skin" id="skinBox">
        ${c.skin ? `<canvas id="skin" aria-label="${esc(c.name)}'s Minecraft character in the MTC hub"></canvas><div class="lb-emote" id="emote" aria-hidden="true"></div><div class="lb-tag">DRAG TO LOOK AROUND</div>`
          : '<p class="none">No Minecraft skin added yet.</p>'}
      </div>
      <div class="c-info">
        <div class="c-top"><img class="c-logo" src="${esc(c.logo)}" alt="" referrerpolicy="no-referrer">
          <div style="min-width:0"><h1>${esc(c.name.toUpperCase())}</h1>${c.live?`<a class="lvbadge" href="${esc(c.live.url)}" target="_blank" rel="noopener" title="${esc(c.live.title)}" style="margin:6px 0 4px"><i aria-hidden="true"></i>LIVE NOW · WATCH</a>`:''}
            <div class="c-sub">${c.avatar ? `<img src="${esc(c.avatar)}" alt="">` : ''}<span>${esc(c.discordName || c.username)} · @${esc(c.username)} on Discord</span></div></div></div>
        <div class="stchips"><span class="stchip sc-ver">${VI.seal}<span><small>STATUS</small>VERIFIED CREATOR</span></span>${s.events ? `<span class="stchip sc-ev">${VI.gamepad}<span><small>EVENTS</small>${s.events} PLAYED</span></span>` : ''}${s.wins ? `<span class="stchip sc-win">${VI.trophy}<span><small>WINS</small>${s.wins} WIN${s.wins > 1 ? 'S' : ''}</span></span>` : ''}${s.podiums ? `<span class="stchip sc-pod">${VI.medal}<span><small>TOP 3</small>${s.podiums} TIME${s.podiums > 1 ? 'S' : ''}</span></span>` : ''}</div>
        <div class="bdgrow" id="crBadges"></div>
        ${c.mc ? `<div><button class="mcname" id="copyMc" title="Copy Minecraft name">${c.mcEdition === 'bedrock' ? 'BEDROCK' : c.mcEdition === 'offline' ? 'OFFLINE' : 'JAVA'}: ${esc(c.mc)} ⧉</button></div>` : ''}
        ${socs.length ? `<div class="socs">${socs.map(([k, u]) => { const web = k.startsWith('website');
          return `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="/assets/icons/${SOC[k] && !web ? k : 'website'}.svg" alt="">${esc(web ? MTC.linkName(u) : SOC[k] || k)}</a>`; }).join('')}</div>` : ''}
        <div class="row" style="margin-top:auto">${c.skin ? `<a class="btn grey" href="${esc(c.skin)}" download="${esc((c.mc || c.username) + '.png')}">GET SKIN</a>` : ''}<button class="btn ghost" id="share">COPY PROFILE LINK</button></div>
      </div>
    </section>
    <div class="c-stats"><div><b>${s.events}</b><span>events played</span></div><div><b>${s.wins}</b><span>wins</span></div><div><b>${s.podiums}</b><span>top 3 finishes</span></div><div><b>${s.uploads}</b><span>showcase uploads</span></div><div><b>${esc(day(s.memberSince) || '—')}</b><span>member since</span></div></div>
    <div class="c-grid">
      <div>
        <div class="card"><div class="row" style="margin-bottom:12px"><h2 style="margin:0;margin-right:auto">LATEST ON YOUTUBE</h2>${c.socials.youtube ? `<a class="btn sm" href="${esc(c.socials.youtube)}?sub_confirmation=1" target="_blank" rel="noopener">SUBSCRIBE</a>` : ''}</div>
          ${v.length ? `<div class="vids">${v.slice(0, 9).map(x => `<button class="vid" data-v="${x.id}" data-t="${esc(x.title)}"><div class="th" style="background-image:url('${esc(x.thumb)}')">${x.short ? '<i>SHORT</i>' : ''}</div><div class="t">${esc(x.title)}</div><div class="m">${x.views ? esc(views(x.views)) + ' · ' : ''}${esc(ago(x.published))}</div></button>`).join('')}</div>`
            : `<p class="soft">${esc((d.youtube && d.youtube.error) || 'No recent Minecraft videos.')}</p>`}</div>
        <div class="card"><h2>MTC EVENTS</h2>${d.events.length ? `<div class="evs">${d.events.map(e => { const role = !e.confirmed ? 'Waiting for confirmation' : e.status === 'open' || e.status === 'soon' ? 'Registered' : e.status === 'live' ? 'Playing now' : e.status === 'cancelled' ? 'Was in it' : e.status === 'unsuccessful' ? 'Played (unsuccessful)' : 'Played';
            return `<a class="ev${e.status === 'cancelled' || e.status === 'unsuccessful' ? ' dim' : ''}" href="/event.html?slug=${encodeURIComponent(e.slug)}">
            <div class="bn" style="${e.banner ? bannerStyle({...e, bannerFit: 'contain', bannerPos: '50% 50%'}) : 'background:linear-gradient(120deg,#3a1f08,#21160D)'}"></div>
            <div class="tx"><b>${esc(e.title)}</b><span class="meta">${esc(e.start ? new Intl.DateTimeFormat('en-IN', {day: 'numeric', month: 'short', year: 'numeric'}).format(new Date(e.start)) : e.dateLabel || '')}${e.team ? ' · Team ' + esc(e.team) : ''}</span>
              <div class="chips">${badge(e.status)}<span class="role">${esc(role)}</span></div></div>
            <div class="pl" title="${e.place ? 'Finished #' + e.place : ''}">${e.place ? `<span class="md${e.place > 3 ? ' num' : ''}">${medal(e.place)}</span><small>${e.points ? esc(e.points) + ' PTS' : e.place === 1 ? 'WINNER' : 'PLACE'}</small>` : ''}</div></a>`; }).join('')}</div>`
          : '<p class="soft">Has not played an MTC event yet.</p>'}</div>
        ${d.media.length ? `<div class="card"><h2>SHOWCASE</h2><div class="gal" id="gal">${d.media.map(m => MTC.tile(m, true)).join('')}</div></div>` : ''}
      </div>
      <div>
        ${fv ? `<div class="card"><h2>FEATURED VIDEO</h2><button class="feat" id="feat" style="background-image:url('https://i.ytimg.com/vi/${fv}/hqdefault.jpg')" aria-label="Play featured video"><i></i></button></div>` : ''}
        <div class="card"><h2>RECENT ACTIVITY</h2>${d.activity.length ? `<ul class="tl">${d.activity.map(a => `<li><span class="ic" aria-hidden="true">${a.icon}</span><div>${a.link ? `<a href="${esc(a.link)}">${esc(a.text)}</a>` : esc(a.text)}<small>${esc(ago(a.at))}</small></div></li>`).join('')}</ul>` : '<p class="soft">Nothing yet.</p>'}</div>
      </div>
    </div>
    <nav class="navc" aria-label="Other creators">${d.prev ? `<a href="/creator.html?u=${encodeURIComponent(d.prev.username)}"><span>←</span><img src="${esc(d.prev.logo)}" alt="" referrerpolicy="no-referrer">${esc(d.prev.name)}</a>` : '<span></span>'}
      <a href="/#creators">ALL ${d.total} CREATORS</a>
      ${d.next ? `<a href="/creator.html?u=${encodeURIComponent(d.next.username)}">${esc(d.next.name)}<img src="${esc(d.next.logo)}" alt="" referrerpolicy="no-referrer"><span>→</span></a>` : '<span></span>'}</nav>`;

  document.querySelectorAll('.vid').forEach(b => b.onclick = () => play(b.dataset.v, b.dataset.t));
  if (fv) $('#feat').onclick = () => { $('#feat').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${fv}?autoplay=1" title="Featured video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; };
  if ($('#gal')) MTC.bindGallery($('#gal'), d.media);
  if ($('#copyMc')) $('#copyMc').onclick = () => { navigator.clipboard?.writeText(c.mc); toast('Minecraft username copied.'); };
  $('#share').onclick = () => { navigator.clipboard?.writeText(location.origin + '/creator.html?u=' + encodeURIComponent(c.username)); toast('Profile link copied.'); };
  if (c.skin && window.skinview3d) skin(c.skin);
}
// ---- the player in the lobby: faces you, breathes, and plays a random emote every few seconds
// only real Emotecraft emotes are used (the hand-made ones were removed)
const EMOTES = [];
// ---- emotes made in Emotecraft (SPEmotes by Milyan), converted to keyframes in /assets/emotes
const DATA_EMOTES = [ // [label, file, prop, loops, author]

  const hand = new Group(); hand.position.set(-1, -10, 0); hand.add(sword); S.rightArm.add(hand);
  const BPM = 124 / 60;
  return { sword, throne, shadow, tick(t) {
    const beat = t * BPM, kick = Math.pow(1 - (beat % 1), 3), bar = Math.floor(beat / 4);
    // dance floor: a colour wave that changes pattern every bar, flashing on the kick
    for (const { m, gx, gz } of tiles) {
      const wave = bar % 3 === 0 ? gx + gz : bar % 3 === 1 ? Math.hypot(gx, gz + 1) * 1.6 : (gx * 7 + gz * 13) % 6;
      const col = PALETTE[Math.abs(Math.floor(wave + beat)) % PALETTE.length], on = .35 + .65 * kick * ((Math.floor(beat) + gx + gz) % 2 ? 1 : .55);
      for (const mt of m.material) mt.emissive.setHex(col).multiplyScalar(on); }
    leds.forEach((l, i) => { const c = PALETTE[(Math.floor(beat / 2) + i) % PALETTE.length]; for (const mt of l.material) mt.emissive.setHex(c).multiplyScalar(.55 + .45 * kick); });
    for (const mt of booth.material) mt.emissive.setHex(PALETTE[Math.floor(beat) % PALETTE.length]).multiplyScalar(.6 + .4 * kick);
    speakers.forEach((g, i) => g.scale.setScalar(1 + .08 * kick * (i % 3 === 2 ? .7 : 1)));
    const whole = Math.floor(beat);
    if (whole !== lastBeat) { lastBeat = whole; for (let k = 0; k < 2; k++) { const n = notes[nextNote++ % notes.length], sp = speakers[(whole * 5 + k * 3) % speakers.length];
      n.born = t; n.x = sp.position.x + (Math.random() - .5) * 6; n.y = sp.position.y + B / 2 + 4; n.z = sp.position.z + 4; n.m.visible = true;
      n.m.material.emissive.setHex(PALETTE[(whole + k * 2) % PALETTE.length]); } }
    for (const n of notes) { const age = t - n.born; if (age > 1.6 || age < 0) { n.m.visible = false; continue; }
      n.m.position.set(n.x + Math.sin(age * 4) * 1.5, n.y + age * 14, n.z); n.m.material.opacity = Math.min(1, 2.2 - age * 1.4); n.m.scale.setScalar(.7 + age * .35); }
    ball.rotation.y = t * .8;
    mirrors.forEach((m, i) => { const sp = (Math.sin(t * 6 + i * 1.7) + 1) / 2; for (const mt of m.material) mt.emissive.setHex(sp > .93 ? PALETTE[i % PALETTE.length] : 0x7a7f88).multiplyScalar(sp > .93 ? 1.4 : .55 + sp * .45); });
    beams.forEach(({ pivot, shaft, col, ph }) => { pivot.rotation.z = Math.sin(t * .9 + ph) * .55; pivot.rotation.x = .35 + Math.sin(t * .7 + ph * 1.3) * .25;
      shaft.material.opacity = .09 + .1 * kick; shaft.material.emissive.setHex(PALETTE[(Math.floor(beat / 4) + Math.round(ph)) % PALETTE.length]); });
  } };
}

function skin(url) {
  const box = $('#skinBox'), cv = $('#skin'), bubble = $('#emote');
  const size = () => ({w: box.clientWidth, h: box.clientHeight});
  let sz = size(), v;
  try { v = new skinview3d.SkinViewer({canvas: cv, width: sz.w, height: sz.h, skin: url}); } catch { cv.remove(); return; }
  window.MTCLobby = v; // handy for debugging in the browser console
  // Minecraft-like field of view, camera a little above the player looking slightly down, small look-around range
  v.fov = 70; v.zoom = .46; v.background = null; v.autoRotate = false;
  v.controls.enableZoom = false; v.controls.enablePan = false; v.controls.minPolarAngle = v.controls.maxPolarAngle = 1.5;
  v.controls.minAzimuthAngle = -.6; v.controls.maxAzimuthAngle = .6; v.controls.target.set(0, 2, 0); v.controls.update();
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P = v.playerObject, S = P.skin, LIMBS = ['head', 'rightArm', 'leftArm', 'rightLeg', 'leftLeg'];
  const home = {}; for (const n of LIMBS) { S[n].rotation.order = 'ZYX'; home[n] = S[n].position.clone(); }
  P.rotation.order = 'ZYX';
  // props need the skin's texture type, so they are built once the skin has loaded
  let props = null, propsTried = false;
  const buildProps = () => { if (propsTried || !S.head.innerLayer.material.map) return; propsTried = true; try { props = makeWorld(v, S); } catch (e) { console.warn('hub', e); } };
  // Emotecraft turns and flips the body around the hips (0.7 blocks above the feet), not around the chest
  const V3 = P.position.constructor, HIP = new V3(0, -4.8, 0), tmp = new V3();
  let data = []; loadEmotes().then(l => { data = l; });
  const qs = new URLSearchParams(location.search), force = (qs.get('emote') || '').toUpperCase(), hold = qs.has('hold');
  let cur = null, start = 0, nextAt = 1.2, last = '';
  const ease = k => k < .18 ? (k / .18) ** 2 * (3 - 2 * k / .18) : k > .82 ? ((1 - k) / .18) ** 2 * (3 - 2 * (1 - k) / .18) : 1;
  v.animation = new skinview3d.FunctionAnimation((pl, t) => {
    buildProps(); if (props) props.tick(t);
    // rest pose with gentle breathing
    const p = {rA: {x: 0, z: -.06}, lA: {x: 0, z: .06}, rL: {x: 0}, lL: {x: 0}, h: {x: 0, y: 0, z: 0}, y: 0, tx: 0, tz: 0, rot: Math.sin(t * .6) * .12};
    p.rA.z += Math.cos(t * 2) * .03; p.lA.z -= Math.cos(t * 2) * .03; p.h.x = Math.sin(t * 1.3) * .04;
    let dataPose = null;
    if (!still) {
      // every emote (hand-made + Emotecraft); ?emote=throne plays only matching ones, &hold=1 freezes mid-emote
      const all = [...EMOTES.map(x => ({ label: x[0], dur: x[1], fn: x[2] })), ...data.map(x => ({ label: x.label, dur: x.ticks / 20, data: x }))];
      const pool = force ? all.filter(x => x.label.includes(force)) : all;
      if (!cur && t >= nextAt && pool.length) { let pick; do pick = pool[Math.floor(Math.random() * pool.length)]; while (pick.label === last && pool.length > 1);
        cur = pick; last = pick.label; start = t; if (bubble) { bubble.innerHTML = esc(cur.label) + (cur.data && cur.data.author ? `<small> by ${esc(cur.data.author)}</small>` : ''); bubble.classList.add('on'); } }
      if (cur) { const k = hold ? (cur.data ? .3 : .5) : (t - start) / cur.dur;
        if (k >= 1) { cur = null; nextAt = t + 1.4 + Math.random() * 2; if (bubble) bubble.classList.remove('on'); }
        else if (cur.data) dataPose = { d: cur.data, tick: loopTick(cur.data.a, k * cur.data.ticks), e: ease(k) };
        else { const base = p.rot; cur.fn(p, t - start, ease(k), k); if (cur.label.includes('🌀')) p.rot += base; } }
    }
    // hand-made pose (also the rest pose)
    for (const n of LIMBS) { S[n].position.copy(home[n]); S[n].rotation.set(0, 0, 0); }
    S.rightArm.rotation.x = p.rA.x; S.rightArm.rotation.z = p.rA.z; S.leftArm.rotation.x = p.lA.x; S.leftArm.rotation.z = p.lA.z;
    S.rightLeg.rotation.x = p.rL.x; S.leftLeg.rotation.x = p.lL.x;
    S.head.rotation.x = p.h.x; S.head.rotation.y = p.h.y; S.head.rotation.z = p.h.z;
    pl.position.set(0, p.y, 0); pl.rotation.set(p.tx, p.rot, p.tz);
    if (props) { props.sword.visible = false; props.throne.visible = false; }
    // Emotecraft pose, blended in and out of the rest pose
    if (dataPose) {
      const { d, tick, e } = dataPose, a = d.a, mix = (from, to) => from + (to - from) * e;
      for (const n of LIMBS) { const q = partPose(a, n, tick), o = S[n];
        o.position.set(mix(o.position.x, q.x), mix(o.position.y, q.y), mix(o.position.z, q.z));
        o.rotation.set(mix(o.rotation.x, q.rx), mix(o.rotation.y, q.ry), mix(o.rotation.z, q.rz)); }
      const b = a.parts.body || {}, g = (ax, def) => axisAt(b[ax], tick, def);
      // the body's offset is in blocks with y pointing up (unlike the limbs)
      const lift = y => y > .9 ? .9 + (y - .9) * .12 : y < -.9 ? -.9 + (y + .9) * .5 : y; // big jumps / levitation are squashed to stay in frame
      // body tilt is in the player's own space (forward = +pitch leans back), so it is turned the other way than the limbs
      const sideways = d.center ? 0 : 1;   // some emotes drift sideways in the game; in the lobby they stay centred
      pl.position.set(mix(0, g('x', 0) * 16 * sideways), mix(p.y, lift(g('y', 0)) * 16), mix(0, -g('z', 0) * 16 * sideways));
      pl.rotation.set(mix(p.tx, -(g('pitch', 0) + g('bend', 0) / 2)), mix(p.rot, -g('yaw', 0)), mix(p.tz, -g('roll', 0)));
      tmp.copy(HIP).applyEuler(pl.rotation); pl.position.add(HIP).sub(tmp);
      // centred emotes: keep the middle of the body (between head and hips) in the middle of the lobby, even when lying down
      if (d.center) { pl.updateMatrixWorld(true); const hd = new V3().setFromMatrixPosition(S.head.matrixWorld), hp = new V3().setFromMatrixPosition(S.rightLeg.matrixWorld).add(new V3().setFromMatrixPosition(S.leftLeg.matrixWorld)).multiplyScalar(.5);
        pl.position.x -= ((hd.x + hp.x * 3) / 4) * e; pl.position.z -= ((hd.z + hp.z * 3) / 4) * e; }
      if (props && d.prop === 'sword') { const s = props.sword, it = a.parts.rightItem || {}, gi = (ax, def) => axisAt(it[ax], tick, def);
        s.visible = e > .05; s.scale.setScalar(Math.max(.01, e));
        s.position.set(gi('x', 0), -gi('y', 0), -gi('z', 0)); s.rotation.set(.78 + gi('pitch', 0), -gi('yaw', 0), -gi('roll', 0)); }
      // this emote sits on the ground: lift the player onto the throne's seat
      if (props && d.prop === 'throne') { props.throne.visible = e > .05; props.throne.scale.setScalar(.6 + .4 * e); pl.position.y += 9 * e; }
    }
    // the round shadow follows the player and fades when they leave the ground
    if (props) { props.shadow.position.x = pl.position.x; props.shadow.position.z = pl.position.z; const up = Math.max(0, pl.position.y); props.shadow.scale.setScalar(Math.max(.4, 1 - up / 40)); }
  });
  const fit = () => { sz = size(); if (sz.w && sz.h) v.setSize(sz.w, sz.h); };
  if (window.ResizeObserver) new ResizeObserver(fit).observe(box); else addEventListener('resize', fit);
}
load(); MTC.foot();
</script>
