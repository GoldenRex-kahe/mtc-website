<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard | MTC</title>
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
.lb-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.lb-top h1{margin:0}
.lb-top select{max-width:240px}
.podium3{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:14px;margin:8px 0 26px}
.pd{background:#1a110a;border:3px solid #000;text-align:center;padding:18px 12px 0;position:relative;min-width:0}
.pd .h3d{margin:0 auto 10px}
.pd .nm{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.pd .pt{font:16px var(--display);color:var(--accent);margin:8px 0}
.pd .st{font-size:12px;color:var(--soft);margin-bottom:10px}
.pd .step{margin:10px -12px 0;font:22px var(--display);color:#000;padding:12px 0;border-top:3px solid #000}
.pd.p1 .step{background:#e0b528;height:96px}.pd.p2 .step{background:#c9cdd2;height:66px}.pd.p3 .step{background:#c07a3d;height:46px}
.pd.p1{border-color:#e0b528;box-shadow:0 0 0 2px #000,0 0 28px #e0b52855}
.lbt{width:100%;border-collapse:collapse}
.lbt th{font:9px var(--display);color:var(--soft);text-align:left;padding:10px 8px;border-bottom:3px solid #000}
.lbt td{padding:10px 8px;border-bottom:2px solid #2a1d12;vertical-align:middle}
.lbt tr:hover td{background:#1f150c}
.lbt .rk{font:13px var(--display);color:var(--soft);width:56px}
.lbt .who{display:flex;align-items:center;gap:10px;min-width:0}
.lbt .who b{overflow-wrap:anywhere}
.lbt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lbt .ptsc{font:14px var(--display);color:var(--accent)}
.lbt .me td{background:#2c1d0d}
.rules-pts{display:flex;flex-wrap:wrap;gap:8px}.rules-pts span{background:#1a110a;border:2px solid #000;padding:6px 10px;font-weight:700}
.hist{font-size:12px;color:var(--soft)}
@media(max-width:640px){.podium3{grid-template-columns:1fr;}.pd.p1{order:-1}.pd .step{height:auto!important}.lbt .hide-s{display:none}}
.head{width:40px;height:40px;border:2px solid #000;flex:none}.head.ini{display:grid;place-items:center;background:#2a1d12;font-weight:800;color:var(--ink)}
.pd .head{margin:0 auto 10px;display:grid}
</style>
<script src="/assets/px.js"></script>
</head>
<body>
<header id="nav"></header>
<main id="main"><p class="soft">Loading...</p></main>
<script src="/assets/app.js"></script>
<script>
const {$, esc, api} = MTC;
MTC.nav();
const face = r => r.skin ? MTC.head3d(r.skin, 40) : r.avatar ? `<img class="head" src="${esc(r.avatar)}" alt="" style="width:40px;height:40px;border:2px solid #000">` : `<b class="head ini" aria-hidden="true">${esc([...(r.name || '?')][0])}</b>`;
async function load(season) {
  const [d, m] = await Promise.all([api('/api/leaderboard' + (season ? '?season=' + encodeURIComponent(season) : '')), MTC.me()]);
  const myId = m.user && m.user.id, P = d.points, rows = d.rows, top = rows.slice(0, 3);
  const sel = d.seasons.length ? `<label class="sr" for="ss">Season</label><select id="ss">${d.seasons.map(s => `<option value="${s.id}"${d.season && d.season.id === s.id ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}<option value="all"${!d.season ? ' selected' : ''}>All time</option></select>` : '';
  $('#main').innerHTML = `<div class="lb-top"><div><h1>LEADERBOARD</h1><p class="soft" style="margin:6px 0 0">${d.season ? esc(d.season.name) + (d.season.start ? ` · ${MTC.day(d.season.start)}${d.season.end ? ' to ' + MTC.day(d.season.end) : ''}` : '') : 'All time'}</p></div>${sel}</div>
    ${rows.length ? `<div class="podium3">${[top[1], top[0], top[2]].map((r, i) => r ? `<div class="pd p${[2, 1, 3][i]}">${face(r)}<div class="nm">${esc(r.name)}</div><div class="pt">${r.points} PTS</div>
      <div class="st">${r.events} event${r.events === 1 ? '' : 's'} · ${r.wins} win${r.wins === 1 ? '' : 's'}</div>${MTC.badgeIcons(r.badges, 8)}<div class="step">${[2, 1, 3][i]}</div></div>` : '<div></div>').join('')}</div>
    <div class="card"><div class="tablewrap"><table class="lbt"><thead><tr><th>RANK</th><th>PLAYER</th><th class="num">POINTS</th><th class="num hide-s">EVENTS</th><th class="num hide-s">WINS</th><th class="num hide-s">TOP 3</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="${r.userId && r.userId === myId ? 'me' : ''}"><td class="rk">#${r.rank}</td><td><div class="who">${face(r)}<div style="min-width:0"><b class="mtc-user">${esc(r.name)}</b>${MTC.edTag(r.edition)} ${MTC.badgeIcons(r.badges)}
        <div class="hist">${r.history.slice(-3).map(h => `<a href="/event.html?slug=${encodeURIComponent(h.slug)}">${esc(h.title)}</a>${h.place ? ' #' + h.place : ''}`).join(' · ')}${r.bonus ? ` · ${r.bonus > 0 ? '+' : ''}${r.bonus} bonus` : ''}</div></div></div></td>
        <td class="num ptsc">${r.points}</td><td class="num hide-s">${r.events}</td><td class="num hide-s">${r.wins}</td><td class="num hide-s">${r.podiums}</td></tr>`).join('')}</tbody></table></div></div>`
    : '<div class="card"><p class="soft">No results in this season yet.</p></div>'}
    <div class="card"><h2>HOW POINTS WORK</h2><div class="rules-pts"><span>Played an event: ${P.played}</span><span>🥇 1st place: +${P.first}</span><span>🥈 2nd place: +${P.second}</span><span>🥉 3rd place: +${P.third}</span><span>Other placed: +${P.placed}</span></div>
      <p class="soft small" style="margin-top:12px">Every player in a finished MTC event gets the <b>Played</b> points, and a place in the results adds its bonus on top (for example a winner gets ${P.played} + ${P.first} = ${P.played + P.first}). In team events every player in the team gets the team's points. Missing an event you signed up for (a no-show) gives no points. Badges are earned by playing, winning and helping the community; staff can also give special badges.</p></div>`;
  if ($('#ss')) $('#ss').onchange = e => load(e.target.value);
}
load(new URLSearchParams(location.search).get('season') || '').catch(x => { $('#main').innerHTML = `<p class="msg err">${esc(x.message)}</p>`; });
MTC.foot();
</script>
</body>
</html>
